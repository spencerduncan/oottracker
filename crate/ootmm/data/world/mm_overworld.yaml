    locationType: scrub
    logic: soul_business_scrub && event(CLOCK_TOWN_SCRUB)
  - id: mm_clock_town_post_box
    name: Clock Town Post Box
    locationType: npc
    logic: has(MASK_POSTMAN)
  - id: mm_clock_town_south_wonder_item_1
    name: Clock Town South Wonder Item 1
    locationType: shop
    logic: hit_target_range_far
  - id: mm_clock_town_south_wonder_item_2
