    exitType: overworld
  - target: mm_clock_tower_roof
    exitType: overworld
    logic: after(NIGHT3_AM_12_00) && cond(setting(erMoon), can_play_time || (can_reset_time && (trick(MM_CLOCK_TOWER_WAIT)
      || can_play_sun)), true)
- id: mm_clock_town_south
