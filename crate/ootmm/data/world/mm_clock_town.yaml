# MM Clock Town and surrounding areas
# This file contains region definitions for the starting areas of Majora's Mask

regions:
  - id: "clock_town_south"
    name: "Clock Town South"
    game: mm
    locations:
      - id: "ct_clock_tower_entrance"
        name: "Clock Tower Entrance"
        locationType: chest
        logic: "true"
      - id: "ct_south_chest"
        name: "Clock Town South Chest"
        locationType: chest
        logic: "has(Deku_Mask) || has(Hookshot)"
      - id: "ct_bank_reward_1"
        name: "Clock Town Bank Reward 1"
        locationType: npc
        logic: "true"
    exits:
      - target: "termina_field"
        exitType: overworld
        logic: "has(Deku_Mask) || is_human"
    events:
      - id: "CLOCK_TOWER_OPENED"
        name: "Clock Tower Opened"
        logic: "has(Ocarina) && has(Moon_Tear)"

  - id: "termina_field"
    name: "Termina Field"
    game: mm
    locations:
      - id: "tf_tall_grass_chest"
        name: "Termina Field Tall Grass Chest"
        locationType: chest
        logic: "true"
    exits:
      - target: "clock_town_south"
        exitType: overworld
        logic: "true"
