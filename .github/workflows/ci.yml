name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Check crates that don't require Python/randomizer
      - name: Clippy core crates
        run: |
          cargo clippy -p ootr -p ootr-dynamic -p oottracker-derive -- -D warnings

  build-core:
    name: Build Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-core
      # Build crates that don't require Python
      - name: Build core crates
        run: |
          cargo build -p ootr -p ootr-dynamic -p oottracker-derive

  # Full build with Python/randomizer - runs on a single platform
  build-full:
    name: Full Build (with Randomizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: full-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache randomizer
        id: cache-randomizer
        uses: actions/cache@v4
        with:
          path: ~/.local/share/Fenhl/RSL/cache/ootr-latest
          key: randomizer-v1  # Bump this to force re-download

      - name: Download OoT Randomizer
        if: steps.cache-randomizer.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/Fenhl/RSL/cache
          cd ~/.local/share/Fenhl/RSL/cache
          # Use a specific commit for reproducibility
          wget -q https://github.com/Roman971/OoT-Randomizer/archive/Dev-R.zip -O randomizer.zip
          unzip -q randomizer.zip
          mv OoT-Randomizer-Dev-R ootr-latest
          rm randomizer.zip

      - name: Build workspace
        run: cargo build --workspace
        continue-on-error: true  # Allow failure until randomizer API is fixed

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run tests for crates that don't need randomizer
      - name: Run tests
        run: cargo test -p ootr -p ootr-dynamic -p oottracker-derive

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (core crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p ootr -p ootr-dynamic -p oottracker-derive --no-deps
